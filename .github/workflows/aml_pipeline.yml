name: AML Tumor Detection Pipeline

on:
  push:
    branches:
      - lab5_mlops_tumor_detection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-aml-pipeline-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity joblib pandas numpy scikit-learn pillow

      - name: Login to Azure using service principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_SECRET }}

      - name: Run Azure ML training pipeline
        run: python src/pipeline_job.py

      - name: Deploy latest model to endpoint
        run: python scripts/deploy_endpoint.py
