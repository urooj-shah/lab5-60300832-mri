name: AML Tumor Detection Pipeline

on:
  push:
    branches:
      - lab5_mlops_tumor_detection
  workflow_dispatch:

jobs:
  run-aml-pipeline-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Azure ML SDK
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity joblib pandas numpy scikit-learn pillow

      - name: Login to Azure with service principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run training pipeline
        run: |
          python src/pipeline_job.py

      - name: Deploy latest model
        run: |
          python scripts/deploy_endpoint.py
